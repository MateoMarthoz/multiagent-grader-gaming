# Sandbox for the Redwood Titanic pilot. Image name and Inspect task name differ from
# the MLE-bench task so the two experiments never share containers.
services:
  default:
    image: redwood-titanic-env:pilot
    x-local: true
    init: true
    command: tail -f /dev/null
    working_dir: /workdir
    network_mode: none
    cpus: 2
    mem_limit: 4gb
