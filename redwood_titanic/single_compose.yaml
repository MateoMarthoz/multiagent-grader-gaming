# Sandbox for single_experiment.py: one container named agent_a, configured like each agent's
# container in multi_compose.yaml (same image, no network, 2 CPUs, 2 GB).
services:
  agent_a:
    image: redwood-titanic-env:pilot
    x-local: true
    x-default: true
    init: true
    command: tail -f /dev/null
    working_dir: /workdir
    network_mode: none
    cpus: 2
    mem_limit: 2gb
